<!doctype html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: page(${seo}, ~{::main}, ~{::#page-scripts})}">
<head></head>
<body>
  <main class="flex-grow flex items-center justify-center py-16">
    <div class="card w-full max-w-sm bg-base-100 shadow-xl">
      <div class="card-body">
        <h1 class="card-title">Create account</h1>
        <p class="text-base-content/60">Join E-Shop to start shopping.</p>
        <form th:action="@{/register}" method="post" th:object="${registrationForm}" class="flex flex-col gap-4">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label class="form-control">
            Email
            <input
                name="email"
                type="email"
                autocomplete="email"
                th:field="*{email}"
                class="input input-bordered"
                aria-describedby="email-errors"
                aria-invalid="${#fields.hasErrors('email')}">
            <span id="email-errors" class="text-error text-sm" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
          </label>
          <label class="form-control">
            Password
            <input
                name="password"
                type="password"
                autocomplete="new-password"
                th:field="*{password}"
                class="input input-bordered"
                aria-describedby="password-errors"
                aria-invalid="${#fields.hasErrors('password')}">
            <span id="password-errors" class="text-error text-sm" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
          </label>
          <button type="submit" class="btn btn-primary">Create account</button>
        </form>
        <p class="text-sm text-base-content/60">
          Already have an account? <a th:href="@{/login}" class="link link-primary">Sign in</a>
        </p>
      </div>
    </div>
  </main>
  <th:block id="page-scripts"></th:block>
</body>
</html>
