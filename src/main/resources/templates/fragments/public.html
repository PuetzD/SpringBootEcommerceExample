<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>
  <nav th:fragment="header" class="bg-white shadow-md border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex-shrink-0">
          <a th:href="@{/}" class="text-2xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent hover:opacity-80 transition">E-Shop</a>
        </div>
        <div class="hidden md:flex items-center space-x-8">
          <a th:href="@{/}" class="text-base-content hover:text-primary font-medium transition">Home</a>
          <details class="dropdown">
            <summary class="cursor-pointer text-base-content hover:text-primary font-medium transition">Categories</summary>
            <ul class="dropdown-content menu bg-base-100 rounded-box z-10 mt-3 w-64 p-2 shadow-lg border border-base-300">
              <li th:each="category : ${categories}">
                <a th:href="@{/catalog/categories/{slug}(slug=${category.slug()})}">
                  <span th:text="${category.name()}">Category</span>
                  <span class="badge badge-ghost" th:text="${category.productCount()}">0</span>
                </a>
              </li>
            </ul>
          </details>
          <a href="#" class="text-base-content hover:text-primary font-medium transition">About</a>
          <a href="#" class="text-base-content hover:text-primary font-medium transition">Contact</a>
        </div>
        <div class="flex items-center space-x-4">
          <a
                  th:href="@{/account}"
                  sec:authorize="hasRole('CUSTOMER')"
                  class="text-base-content hover:text-primary transition"
                  aria-label="Account"
          >
            <span class="icon-[mdi--account-outline] h-6 w-6" aria-hidden="true"></span>
          </a>
          <a th:href="@{/cart}" class="text-base-content hover:text-primary transition" aria-label="Shopping cart">
            <span class="icon-[mdi--cart-outline] h-6 w-6" aria-hidden="true"></span>
          </a>
          <a
                  sec:authorize="!isAuthenticated()"
                  th:href="@{/login}"
                  class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-indigo-500 transition"
          >
            Sign In
          </a>
          <form
                  sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="inline"
          >
            <button
                    type="submit"
                    class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-indigo-500 transition"
            >
              Logout
            </button>
          </form>
        </div>
      </div>
    </div>
  </nav>

  <footer th:fragment="footer" class="bg-neutral text-neutral-content py-12 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <p class="text-lg font-semibold mb-2">E-Shop</p>
      <p>&copy; 2026 Spring Boot Ecommerce. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
