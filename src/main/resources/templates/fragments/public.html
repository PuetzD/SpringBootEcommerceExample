<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>
  <div th:fragment="header">
    <nav aria-label="Primary" class="navbar bg-base-200 sticky top-0 z-50 shadow-md">
      <div class="navbar-start">
        <a th:href="@{/}" class="btn btn-ghost text-xl font-bold">E-Shop</a>
      </div>
      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1">
          <li><a th:href="@{/}">Home</a></li>
          <li><a th:href="@{/catalog}">Products</a></li>
        </ul>
      </div>
      <div class="navbar-end">
        <a th:href="@{/cart}" class="btn btn-ghost" aria-label="Shopping cart">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/>
          </svg>
        </a>
        <a
            sec:authorize="!isAuthenticated()"
            th:href="@{/login}"
            class="btn btn-primary"
        >
          Sign In
        </a>
        <form
            sec:authorize="isAuthenticated()"
            th:action="@{/logout}"
            method="post"
            class="inline"
        >
          <button type="submit" class="btn btn-primary">Logout</button>
        </form>
      </div>
    </nav>
  </div>

  <footer th:fragment="footer" class="footer footer-center bg-base-200 text-base-content p-6 mt-auto">
    <nav>
      <p class="font-semibold">E-Shop</p>
      <p>&copy; 2026 Spring Boot Ecommerce. All rights reserved.</p>
    </nav>
  </footer>
</body>
</html>
