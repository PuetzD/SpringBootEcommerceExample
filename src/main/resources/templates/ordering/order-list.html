<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${seo}, ~{::main}, ~{::#page-scripts})}">
<head></head>
<body>
<main class="flex-grow py-12">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-2xl font-bold mb-8">Your orders</h1>
    <p th:if="${#lists.isEmpty(orders)}" class="text-base-content/60">You have not placed any orders yet.</p>
    <ul th:unless="${#lists.isEmpty(orders)}" class="flex flex-col gap-4">
      <li th:each="order : ${orders}" class="card bg-base-100 shadow-sm">
        <div class="card-body flex-row justify-between items-center">
          <div>
            <h2 class="card-title" th:text="${order.orderNumber()}">ORD-00000000-000000000000</h2>
            <p th:text="${#temporals.format(order.placedAt(), 'yyyy-MM-dd HH:mm')}">2026-08-30</p>
          </div>
          <div class="text-right">
            <p class="font-semibold" th:text="${order.total().amount()}">0.00</p>
            <a class="btn btn-sm btn-primary" th:href="@{/orders/{number}(number=${order.orderNumber()})}">View order</a>
          </div>
        </div>
      </li>
    </ul>
  </div>
</main>
<th:block id="page-scripts"></th:block>
</body>
</html>
