<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(${seo}, ~{::main}, ~{::#page-scripts})}">
<head></head>
<body>
<main class="flex-grow py-12">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-2xl font-bold mb-8">Checkout</h1>
    <div class="alert alert-error mb-6" th:if="${checkoutError}" th:text="${checkoutError}">Checkout unavailable</div>
    <div th:if="${#lists.isEmpty(checkout.items())}" class="alert alert-info mb-6">Your cart is empty.</div>
    <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post" class="flex flex-col gap-6">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" th:field="*{checkoutId}">
      <div th:if="${#fields.hasErrors('checkoutId')}" class="text-error" th:errors="*{checkoutId}"></div>
      <section>
        <h2 class="text-lg font-semibold mb-3">Items</h2>
        <ul class="list bg-base-100 rounded-box shadow-sm">
          <li th:each="item : ${checkout.items()}" class="list-row">
            <span>Product <span th:text="${item.product().value()}">1</span></span>
            <span>Quantity <span th:text="${item.quantity()}">1</span></span>
          </li>
        </ul>
      </section>
      <section>
        <h2 class="text-lg font-semibold mb-3">Delivery addresses</h2>
        <label class="label" for="shippingAddressId">Shipping</label>
        <select id="shippingAddressId" th:field="*{shippingAddressId}" class="select select-bordered w-full">
          <option value="">Select an address</option>
          <option th:each="address : ${checkout.addresses()}" th:value="${address.address().value()}" th:text="${address.recipientName() + ' — ' + address.postalCode() + ' ' + address.city()}">Address</option>
        </select>
        <div class="text-error" th:errors="*{shippingAddressId}"></div>
        <label class="label" for="billingAddressId">Billing</label>
        <select id="billingAddressId" th:field="*{billingAddressId}" class="select select-bordered w-full">
          <option value="">Select an address</option>
          <option th:each="address : ${checkout.addresses()}" th:value="${address.address().value()}" th:text="${address.recipientName() + ' — ' + address.postalCode() + ' ' + address.city()}">Address</option>
        </select>
        <div class="text-error" th:errors="*{billingAddressId}"></div>
      </section>
      <button type="submit" class="btn btn-primary self-start" th:disabled="${#lists.isEmpty(checkout.items())}">Place order</button>
    </form>
  </div>
</main>
<th:block id="page-scripts"></th:block>
</body>
</html>
