<!doctype html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: page(${seo}, ~{::main}, ~{::#page-scripts})}">
<head></head>
<body>
  <main class="flex-grow py-12">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-2xl font-bold">Your cart</h1>
          <p class="text-base-content/60">Review and update the items in your cart.</p>
        </div>
      </div>

      <ul class="flex flex-col gap-4" th:if="${!cartEmpty}">
        <li
            th:each="line : ${lines}"
            class="card bg-base-100 shadow-sm">
          <div class="card-body">
            <div class="flex justify-between items-start gap-4">
              <div>
                <th:block th:if="${line.available()}">
                  <p class="font-semibold" th:text="${line.product().name()}">Product</p>
                  <p class="font-mono text-sm text-base-content/60" th:text="${line.product().sku()}">SKU</p>
                  <p class="text-base-content/70" th:text="${#numbers.formatDecimal(line.product().price().amount(), 1, 2) + ' EUR'}">0.00 EUR</p>
                </th:block>
                <p th:unless="${line.available()}" class="font-semibold text-warning">This item is no longer available</p>
                <p class="text-base-content/60">Quantity: <span th:text="${line.item().quantity()}">1</span></p>
              </div>
              <form th:action="@{/cart/items/{id}/remove(id=${line.item().variant().value()})}" method="post" class="flex items-start">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm btn-error btn-outline">Remove</button>
              </form>
            </div>
            <form
                th:if="${line.available()}"
                th:action="@{/cart/items/{id}/quantity(id=${line.item().variant().value()})}"
                method="post"
                class="mt-4 flex items-end gap-2">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <label class="form-control" th:for="${'quantity-' + line.item().variant().value()}">
                <span class="label-text text-sm">Quantity</span>
                <input
                    type="number"
                    th:id="${'quantity-' + line.item().variant().value()}"
                    name="quantity"
                    min="1"
                    max="999"
                    th:value="${line.item().quantity()}"
                    class="input input-bordered input-sm w-24"
                    aria-label="Quantity">
              </label>
              <button type="submit" class="btn btn-sm btn-primary">Update</button>
            </form>
          </div>
        </li>
      </ul>

      <p class="text-base-content/60 mt-6" th:if="${cartEmpty}">
        Your cart is empty.
      </p>

      <div th:if="${!cartEmpty and !checkoutAllowed}" role="alert" class="alert alert-warning mt-6">
        Remove unavailable items before checkout.
      </div>

        <p class="mt-8" th:if="${checkoutAllowed and customer != null}">
          <a th:href="@{/checkout}" class="btn btn-primary">Checkout</a>
        </p>
    </div>
  </main>
  <th:block id="page-scripts"></th:block>
</body>
</html>
