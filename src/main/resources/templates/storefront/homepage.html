<!doctype html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: page(${seo}, ~{::main}, ~{::#page-scripts})}">
<head></head>
<body>
  <main class="flex-grow">
    <section class="w-full bg-gradient-to-br from-primary via-indigo-500 to-secondary text-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24 text-center">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-white">
          Welcome to <span class="text-secondary-content/90">Shop Happens</span>
        </h1>
        <p class="mt-6 max-w-2xl mx-auto text-lg sm:text-xl text-white/80">
          Buy stuff. Be happy.
        </p>
        <div class="mt-10 flex justify-center space-x-4">
          <a th:href="@{/catalog}" class="bg-accent text-white font-semibold px-8 py-3 rounded-lg hover:bg-emerald-600 hover:scale-110 transition-all shadow-lg">
            Shop Now
          </a>
          <a th:href="@{/catalog}" class="border-2 border-white text-white font-semibold px-8 py-3 rounded-lg hover:bg-white hover:text-primary hover:scale-110 transition-all">
            Learn More
          </a>
        </div>
      </div>
    </section>

    <section class="py-16 bg-base-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-3xl font-bold text-center mb-12 text-base-content">Featured Products</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
          <article
              class="bg-base-100 rounded-2xl shadow-md overflow-hidden hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 relative"
              th:each="product, iteration : ${featuredProducts}">
            <span class="absolute top-4 left-4 bg-secondary text-white text-xs font-semibold px-3 py-1 rounded-full z-10" th:if="${iteration.index == 0}">Featured</span>
            <div class="h-48 bg-gradient-to-br from-primary to-secondary flex items-center justify-center">
              <img
                  th:if="${product.imageUrl() != null}"
                  th:src="${product.imageUrl()}"
                  alt=""
                  class="h-full w-full object-cover">
              <span th:unless="${product.imageUrl() != null}" class="icon-[mdi--package-variant] text-white text-6xl"></span>
            </div>
            <div class="p-6">
              <h3 class="text-xl font-semibold mb-2 text-base-content" th:text="${product.name()}">Product</h3>
              <p class="text-base-content/60 mb-4" th:text="${product.description()}">Description</p>
              <div class="flex justify-between items-center">
                <span class="text-2xl font-bold text-primary" th:text="${#numbers.formatDecimal(product.price().amount(), 1, 2)}">EUR 0.00</span>
                <a th:href="@{/catalog/products/{sku}(sku=${product.sku()})}" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-indigo-500 transition">View Product</a>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>
  <th:block id="page-scripts"></th:block>
</body>
</html>
