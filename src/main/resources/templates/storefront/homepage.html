<!doctype html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{index :: page(${seo}, ~{::main}, ~{::#page-scripts})}">
<head></head>
<body>
  <main class="flex-grow">
    <section class="hero bg-base-200">
      <div class="hero-content text-center py-24">
        <div class="max-w-2xl">
          <h1 class="text-5xl font-bold">Shop Happens</h1>
          <p class="py-6 text-base-content/70">Buy stuff. Be happy.</p>
          <a class="btn btn-primary" th:href="@{/catalog}">Browse products</a>
        </div>
      </div>
    </section>

    <section class="py-16 bg-base-100">
      <div class="container mx-auto px-4 sm:px-6">
        <h2 class="text-3xl font-bold text-center mb-12">Featured Products</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <article class="card card-border bg-base-100" th:each="product, iteration : ${featuredProducts}">
            <figure th:if="${product.imageUrl() != null}">
              <img
                  th:src="${product.imageUrl()}"
                  alt=""
                  width="640"
                  height="360"
                  loading="lazy">
            </figure>
            <div class="card-body">
              <div class="flex items-start justify-between gap-4">
                <h2 class="card-title" th:text="${product.name()}">Product</h2>
                <span class="badge badge-success badge-soft" th:if="${product.inStock()}">In stock</span>
                <span class="badge badge-warning badge-soft" th:unless="${product.inStock()}">Out of stock</span>
              </div>
              <p class="text-base-content/70" th:text="${product.description()}">Description</p>
              <p class="font-semibold" th:text="${#numbers.formatDecimal(product.price().amount(), 1, 2)}">0.00</p>
              <div class="card-actions justify-end">
                <a class="btn" th:href="@{/catalog/products/{sku}(sku=${product.sku()})}">View product</a>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>
  <th:block id="page-scripts"></th:block>
</body>
</html>
