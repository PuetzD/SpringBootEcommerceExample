<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(seo, mainContent, pageScripts)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${seo.title}">Shop Happens</title>
  <meta name="description" th:content="${seo.description}">
  <link rel="canonical" th:href="${canonicalUrl}">
  <meta name="robots" th:content="${seo.robots}">
  <meta property="og:title" th:content="${seo.openGraphTitle}">
  <meta property="og:description" th:content="${seo.openGraphDescription}">
  <meta property="og:type" th:content="${seo.openGraphType}">
  <meta property="og:url" th:content="${canonicalUrl}">
  <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="min-h-screen flex flex-col" data-page-layout="public">
  <th:block th:replace="~{fragments/public :: header}"></th:block>
  <th:block th:replace="${mainContent}"></th:block>
  <th:block th:replace="~{fragments/public :: footer}"></th:block>
  <th:block th:replace="${pageScripts}"></th:block>
</body>
</html>
