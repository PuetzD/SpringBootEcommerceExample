spring:
  application:
    name: ecommerce
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/demo}
    username: ${SPRING_DATASOURCE_USERNAME:demo}
    password: ${SPRING_DATASOURCE_PASSWORD:demo}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s
  session:
    timeout: 30m
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      properties:
        enable.idempotence: ${SPRING_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}
        acks: all
  mail:
    host: ${SPRING_MAIL_HOST:mailpit}
    port: ${SPRING_MAIL_PORT:1025}
logging:
  file:
    name: ${LOGGING_FILE_NAME:logs/ecommerce.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
storefront:
  public-origin: ${STOREFRONT_PUBLIC_ORIGIN:http://localhost:8080}
ordering:
  events:
    kafka:
      enabled: ${ORDERING_EVENTS_KAFKA_ENABLED:true}
      poll-delay: ${ORDERING_EVENTS_KAFKA_POLL_DELAY:1000}
notifications:
  email:
    enabled: ${NOTIFICATIONS_EMAIL_ENABLED:true}
    from: ${NOTIFICATIONS_EMAIL_FROM:shop@example.com}
    kafka:
      group: ${NOTIFICATIONS_EMAIL_KAFKA_GROUP:order-confirmation-email}
