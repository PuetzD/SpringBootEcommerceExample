spring:
  application:
    name: ecommerce
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/demo}
    username: ${SPRING_DATASOURCE_USERNAME:demo}
    password: ${SPRING_DATASOURCE_PASSWORD:demo}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  session:
    timeout: 30m
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        enable.idempotence: ${SPRING_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}
        acks: all
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      wait:
        timeout: 60s
        for: healthy
server:
  port: 8080
storefront:
  public-origin: ${STOREFRONT_PUBLIC_ORIGIN:http://localhost:8080}
ordering:
  events:
    kafka:
      enabled: ${ORDERING_EVENTS_KAFKA_ENABLED:false}
      poll-delay: ${ORDERING_EVENTS_KAFKA_POLL_DELAY:1000}
